name: Feature request
description: Something the bot should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A few things are deliberately out of scope — image and audio generation, storing
        message text, a web dashboard, and anything aimed at getting past a provider's free
        quota with several accounts. They are listed in
        [CONTRIBUTING.md](https://github.com/hami9/Astolfo/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward or impossible today. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Settings, commands or panel screens that nearly do it.

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Persona and replies
        - Routing and models
        - Providers, keys and cost
        - The owner's panel
        - Media handling
        - Deployment
        - Documentation
        - Something else
    validations:
      required: true
