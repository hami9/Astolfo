name: Release

# Tag a commit `vX.Y.Z` and this does the rest: it refuses a tag that disagrees
# with the version in the source, runs the suite, builds the package, and
# publishes a release with the changelog section for that version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v2.0.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt build twine

      - name: The tag must match the version in the source
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          source="$(python -c 'import astolfo; print(astolfo.__version__)')"
          echo "tag $tag, source $source"
          if [ "$tag" != "v$source" ]; then
            echo "::error::tag $tag does not match astolfo.__version__ ($source)"
            exit 1
          fi
          echo "version=$source" >> "$GITHUB_OUTPUT"

      - run: ruff check .
      - run: pytest -q

      - name: Build the sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: The wheel must carry every package
        run: python .github/scripts/check_wheel.py

      - name: Release notes from the changelog
        run: python .github/scripts/release_notes.py "${{ steps.version.outputs.version }}" > NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            NOTES.md

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file NOTES.md --title "$TAG"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file NOTES.md --verify-tag
          fi

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/astolfo:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/astolfo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
