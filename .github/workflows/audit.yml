name: Audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt --strict

  secrets:
    name: leaked credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
