[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astolfo-bot"
version = "2.0.0"
description = "Telegram persona bot with adaptive fast/think/search routing, multimodal input and credit controls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6,<22",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0",
    "Pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
astolfo = "astolfo.__main__:main"

[tool.setuptools]
packages = ["astolfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `pytest` works without an editable install
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# persona.py is mostly prompt prose; rewrapping it would change what the model reads.
"astolfo/persona.py" = ["E501"]
