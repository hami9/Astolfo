[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astolfo-bot"
dynamic = ["version"]        # single-sourced from astolfo/__init__.py
description = "Telegram persona bot with adaptive fast/think/search routing, multimodal input and credit controls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telegram", "telegram-bot", "llm", "chatbot", "openrouter", "persona"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6,<23",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0",
    "Pillow>=10.3",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/hami9/Astolfo"
Documentation = "https://github.com/hami9/Astolfo/tree/main/docs"
Changelog = "https://github.com/hami9/Astolfo/blob/main/CHANGELOG.md"
Issues = "https://github.com/hami9/Astolfo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
astolfo = "astolfo.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "astolfo.__version__" }

# find, not a list: astolfo.admin was left out of the wheel when this was written
# by hand, and an installed bot without its panel fails at import.
[tool.setuptools.packages.find]
include = ["astolfo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `pytest` works without an editable install
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# persona.py is mostly prompt prose; rewrapping it would change what the model reads.
"astolfo/persona.py" = ["E501"]
# Tests assert on behaviour, including the assert statement itself and sample keys
# that are not credentials.
"tests/*" = ["S101", "S105", "S106", "S108"]
